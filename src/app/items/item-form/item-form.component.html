<div class="page">
  <h2>{{ isEdit ? 'Edit Item' : 'Add Item' }}</h2>

  <div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>

  <form (ngSubmit)="save()" class="item-form">
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label">Item Code</label>
        <input class="form-control" name="itemCode" [(ngModel)]="item.itemCode" [disabled]="isEdit" />
      </div>
      <div class="col-md-4">
        <label class="form-label">Item Name</label>
        <input class="form-control" name="itemName" [(ngModel)]="item.itemName" />
      </div>
      <div class="col-md-4">
        <label class="form-label">Category</label>
        <input class="form-control" name="category" [(ngModel)]="item.category" placeholder="e.g. Wooden Craft" />
      </div>

      <div class="col-md-4">
        <label class="form-label">Material</label>
        <input class="form-control" name="material" [(ngModel)]="item.material" />
      </div>
      <div class="col-md-4">
        <label class="form-label">Location</label>
        <input class="form-control" name="location" [(ngModel)]="item.location" />
      </div>
      <div class="col-md-4">
        <label class="form-label">Finish</label>
        <input class="form-control" name="finish" [(ngModel)]="item.finish" />
      </div>

      <div class="col-6 col-md-3">
        <label class="form-label">Length</label>
        <input class="form-control" type="number" name="length" [(ngModel)]="item.length" />
      </div>
      <div class="col-6 col-md-3">
        <label class="form-label">Width</label>
        <input class="form-control" type="number" name="width" [(ngModel)]="item.width" />
      </div>
      <div class="col-6 col-md-3">
        <label class="form-label">Height</label>
        <input class="form-control" type="number" name="height" [(ngModel)]="item.height" />
      </div>
      <div class="col-6 col-md-3">
        <label class="form-label">Weight</label>
        <input class="form-control" type="number" name="weight" [(ngModel)]="item.weight" />
      </div>

      <div class="col-6 col-md-3">
        <label class="form-label">Quantity</label>
        <input class="form-control" type="number" name="quantity" [(ngModel)]="item.quantity" />
      </div>
      <div class="col-6 col-md-3">
        <label class="form-label">Cost Price</label>
        <input class="form-control" type="number" name="costPrice" [(ngModel)]="item.costPrice" />
      </div>
      <div class="col-6 col-md-3">
        <label class="form-label">Selling Price</label>
        <input class="form-control" type="number" name="sellingPrice" [(ngModel)]="item.sellingPrice" />
      </div>
      <div class="col-6 col-md-3">
        <label class="form-label">Status</label>
        <select class="form-select" name="status" [(ngModel)]="item.status">
          <option value="In Stock">In Stock</option>
          <option value="Process">Process</option>
          <option value="Sold">Sold</option>
        </select>
      </div>

      <div class="col-md-8">
        <label class="form-label">Description</label>
        <textarea class="form-control" name="description" [(ngModel)]="item.description" rows="2"></textarea>
      </div>
      <div class="col-md-4">
        <label class="form-label">Image</label>
        <input class="form-control" type="file" accept="image/*" (change)="onImageSelected($event)" />
        <img *ngIf="item.imageUrl" [src]="item.imageUrl" class="preview" alt="Item preview" />
      </div>
    </div>

    <div class="mt-4">
      <button class="btn btn-dark" type="submit" [disabled]="saving">
        {{ saving ? 'Saving...' : 'Save Item' }}
      </button>
    </div>
  </form>
</div>
