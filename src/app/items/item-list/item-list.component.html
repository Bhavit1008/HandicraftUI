<div class="page">
  <div class="page-header">
    <h2>Items</h2>
    <a class="btn btn-dark" routerLink="/items/new">+ Add Item</a>
  </div>

  <div *ngIf="loading">Loading...</div>
  <div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>

  <table class="table table-hover" *ngIf="!loading && items.length">
    <thead>
      <tr>
        <th>Item Code</th>
        <th>Name</th>
        <th>Category</th>
        <th>Qty</th>
        <th>Status</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of items">
        <td>{{ item.itemCode }}</td>
        <td>{{ item.itemName }}</td>
        <td>{{ item.category }}</td>
        <td>{{ item.quantity }}</td>
        <td>{{ item.status }}</td>
        <td class="text-end">
          <a class="btn btn-sm btn-outline-secondary" [routerLink]="['/items', item.id, 'edit']">Edit</a>
          <button class="btn btn-sm btn-outline-danger ms-2" (click)="remove(item)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="!loading && !items.length">No items yet.</p>
</div>
