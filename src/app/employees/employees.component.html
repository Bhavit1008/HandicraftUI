<div class="page">
  <div class="page-header">
    <h2>Employees</h2>
    <button class="btn btn-dark" (click)="startAdd()">+ Add Employee</button>
  </div>

  <div class="card p-3 mb-4" *ngIf="showForm">
    <div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>
    <form (ngSubmit)="save()" class="row g-3">
      <div class="col-md-3">
        <label class="form-label">Employee Name</label>
        <input class="form-control" name="employeeName" [(ngModel)]="draft.employeeName" />
      </div>
      <div class="col-md-3">
        <label class="form-label">Password</label>
        <input class="form-control" type="password" name="password" [(ngModel)]="draft.password" />
      </div>
      <div class="col-md-3">
        <label class="form-label">Role</label>
        <select class="form-select" name="role" [(ngModel)]="draft.role">
          <option value="admin">Admin</option>
          <option value="store_manager">Store Manager</option>
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label">Locations (comma-separated)</label>
        <input class="form-control" name="locationsText" [(ngModel)]="locationsText" />
      </div>
      <div class="col-12">
        <button class="btn btn-dark" type="submit">Save</button>
        <button class="btn btn-outline-secondary ms-2" type="button" (click)="showForm = false">Cancel</button>
      </div>
    </form>
  </div>

  <table class="table table-hover">
    <thead>
      <tr>
        <th>Name</th>
        <th>Role</th>
        <th>Locations</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let employee of employees">
        <td>{{ employee.employeeName }}</td>
        <td>{{ employee.role }}</td>
        <td>{{ (employee.assignedLocations || []).join(', ') }}</td>
        <td class="text-end">
          <button class="btn btn-sm btn-outline-danger" (click)="remove(employee)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
