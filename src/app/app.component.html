<div class="app-shell" [class.menu-open]="menuOpen">

  <!-- Mobile/tablet top bar; hidden on desktop -->
  <header class="top-bar" *ngIf="!isLoginPage">
    <button type="button" class="menu-btn" (click)="setMenu(true)" aria-label="Open menu"
            aria-controls="side-nav" [attr.aria-expanded]="menuOpen">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
    <span class="top-brand">HANDICRAFT <small>INVENTORY</small></span>
    <div class="top-avatar" [title]="currentUser">{{ initials }}</div>
  </header>

  <div class="nav-backdrop" *ngIf="!isLoginPage && menuOpen" (click)="setMenu(false)"></div>

  <aside id="side-nav" class="side-nav" *ngIf="!isLoginPage" (click)="onNavClick($event)">
    <div class="brand">
      <svg class="brand-logo" width="36" height="36" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2 3 7l9 5 9-5-9-5Z" fill="#ff7a45" />
        <path d="M3 7v10l9 5V12L3 7Z" fill="#ff5a1f" />
        <path d="M21 7v10l-9 5V12l9-5Z" fill="#e0440d" />
      </svg>
      <div class="brand-text">
        <span class="brand-mark">HANDICRAFT</span>
        <span class="brand-sub">INVENTORY</span>
      </div>
      <button type="button" class="nav-close" (click)="setMenu(false)" aria-label="Close menu">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 6l12 12M18 6 6 18" />
        </svg>
      </button>
    </div>

    <nav class="nav-list">
      <button type="button" class="nav-item" [class.active]="isInventoryRoute"
              [attr.aria-expanded]="inventoryOpen" (click)="inventoryOpen = !inventoryOpen">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3 4 7.5v9L12 21l8-4.5v-9L12 3Zm0 0v18M4 7.5l8 4.5 8-4.5" />
        </svg>
        <span class="nav-label">Inventory</span>
        <svg class="nav-chevron" [class.open]="inventoryOpen" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m6 9 6 6 6-6" />
        </svg>
      </button>

      <div class="nav-sub" *ngIf="inventoryOpen">
        <a class="nav-sub-item" routerLink="/items" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Items</a>
        <a class="nav-sub-item" routerLink="/items/new" routerLinkActive="active">Add Item</a>
        <a class="nav-sub-item" routerLink="/inventory/poster-stock" routerLinkActive="active">Poster Stock</a>
        <a class="nav-sub-item" routerLink="/inventory/add-poster" routerLinkActive="active">Add Poster</a>
      </div>

      <a class="nav-item" routerLink="/employees" routerLinkActive="active" *ngIf="isAdmin">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="4" />
          <path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5" />
        </svg>
        <span class="nav-label">Employees</span>
      </a>

      <a class="nav-item" routerLink="/audit-log" routerLinkActive="active" *ngIf="isAdmin">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 3h9l4 4v14H6V3Zm9 0v4h4M9 12h7M9 16h7" />
        </svg>
        <span class="nav-label">Audit Log</span>
      </a>
    </nav>

    <div class="user-card">
      <div class="user-avatar">{{ initials }}</div>
      <div class="user-info">
        <span class="user-name">{{ currentUser }}</span>
        <span class="user-role">{{ roleLabel }}</span>
      </div>
      <button type="button" class="logout-btn" (click)="logout()" title="Logout" aria-label="Logout">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10" />
        </svg>
      </button>
    </div>
  </aside>

  <div class="main-area">
    <router-outlet></router-outlet>
  </div>

</div>
